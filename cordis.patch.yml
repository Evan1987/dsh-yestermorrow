# YESTERMORROW skin bundle patch: inserts its public dsh.client entry into the web plugin roster.
# Install with `dsh plugin --profile web add <path-or-git-url>`.
# Mutual exclusion between skins is managed by the DSH profile: keep only one skin bundle enabled.
- insert:
    - id: ui-skin-yestermorrow
      name: '@zcm/dsh-client-ui-skin-yestermorrow'
